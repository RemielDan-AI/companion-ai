# 记忆重要度生命周期配置（对应 项目改进v1.txt 基础改进 3 与优化项 12/13/14/15/16）
# 改这个文件就能调整衰减、回升、冷存储与检索排序，不用动代码。

enabled: true

floor: 0.05              # 重要度下限：随时间衰减但不归零
max_importance: 5.0      # 重要度上限：回升不会超过它

archive_threshold: 0.15  # 有效重要度低于此值
archive_idle_days: 30    # 且超过这么久没被访问 → 转冷存储（不删除，检索仍可命中）

boost:                   # 重要度回升
  retrieved: 0.25        # 被检索命中 → 小幅回升
  mentioned: 0.40        # 被用户主动提起 → 明显回升
  related: 0.15          # 与当前话题相关 → 临时提升（不写回数据库）

half_life_days:          # 不同记忆类型不同半衰期（天）
  fact: 180              # 事实：慢衰减
  preference: 120        # 偏好
  relation: 365          # 关系：很慢
  event: 60              # 事件：中
  emotion: 45            # 情绪：中
  trivia: 14             # 琐事：快
  value: 3650            # 价值观证据：几乎不衰减
  default: 60

retention_factor:        # 用户标记对半衰期的影响（乘数）
  normal: 1.0
  temporary: 2.0         # 暂时保留：延长衰减周期
  forgettable: 0.25      # 可遗忘：快速衰减
  permanent: 0.0         # 永久重要：不衰减

initial:                 # 新记忆的初始重要度（1–5）
  explicit: 4.5          # 显式说出来的信息
  strong_emotion: 4.5    # 情绪强烈的事件
  repeated: 4.0          # 重复出现过
  default: 3.0
  chitchat: 2.0          # 普通闲聊

rank_weights:            # 检索排序权重
  # ⚠ 2026-10-19 调过：原来 0.60/0.25/0.15，**recency 只有 0.15**，
  #   加上默认半衰期 60 天，「昨天」和「一周前」算出来是 0.99 和 0.92，
  #   **近期与近期之间的先后几乎分不出来**。
  #   实测（tests/analysis/recency_bench.py，同一件事新旧两条并存）：
  #
  #     权重(rel/imp/rec)   近期排第一   目标进top4   旧说法排前
  #     0.60/0.25/0.15        2/6         6/6         **4/6**  ← 现状是反的
  #     0.55/0.20/0.25        4/6         6/6          2/6
  #     **0.45/0.15/0.40**    **5/6**     **6/6**      **1/6**
  #
  #   → 抬 recency 之后**旧说法排前的从 4/6 降到 1/6**，而 **hit 一直是 6/6**
  #     （说明"近期但不相关"的没被顶上来）。
  #   relevance 仍是最高的（0.45），**相关性依旧是主导**——rank_score 只给
  #   已经过了闸门的候选排序，不是召回本身。
  relevance: 0.45
  importance: 0.15
  recency: 0.40

max_inject_chars: 380    # 主动注入记忆块的长度上限（上下文预算）
