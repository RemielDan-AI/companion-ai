# 界面外观（只放"换图/换色"这类**不影响功能**的项）
#
# 为什么单独一个文件：这些是使用者随手会改的东西，
# 混进 persona/style 那些核心配置里容易误改到别处。

# 角色形象图（界面左侧那个形象）。
#
# 查找顺序：
#   ① 绝对路径 → 直接用
#   ② 相对路径 → 依次在**本项目根目录 / assets / 头像 / 立绘 / 皮肤目录**里找
#   ③ 留空 → 自动挑：本项目根目录里命名的（头像/立绘/avatar/character/portrait）优先，
#             其次面积最大的竖版图；都没有再退回皮肤包
#
# ⚠ **白底的图会自动抠成透明底**（从四边泛洪，保留内部的发光/亮部）。
#   只在"四角确实是白的"时才抠——抠错比不抠更糟。
# 留空 = 不指定立绘，界面会用代码里自绘的矢量形象兜底
character_asset: ""

# 形象区尺寸（像素）。左侧栏宽度随之变化。
character_width: 236
character_height: 220

# 皮肤包目录（可选）。留空 = 不找皮肤包，只在项目目录/头像/立绘 里找立绘。
# 想用皮肤包就填绝对路径，例如 D:/skins/xxx/assets/runtime
skin_dir: ""
