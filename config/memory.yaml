# 记忆相关的运行参数

# 是否让模型**把两条冲突记忆合并成一句**（`cognition/merge.py`）。
#
# ⚠ 2026-10-19 默认改成 **false**（用户实测：重复询问时 4B 会把主体搞乱）。
#   怀疑原因：`MERGE_TEMPLATE` 明确要求「合并成**一句**最准确的话」——
#   两条事实压成一句，句子里就出现**多个主体/多个谓词**，
#   小模型读到这种复合句容易把「谁对什么」对错号。
#   关掉之后：冲突条目仍**并存保留**并打上 `conflict_with`（**不丢记忆**），
#   只是不再尝试把它们合成一句。块的「同一件事有两种说法：新的…旧的…」照旧标注。
# 想恢复合并：设成 true，或临时 `COMPANION_ENABLE_MERGE=1`。
merge_conflicts: false

# 多少轮做一次记忆提取（攒够就一起提取，用来降延迟）。
#   1 = 每轮都提取（默认，行为与以前一致；测试与需要即时记忆时用这个）
#   3 = 每三轮一提（对话更跟手；检索本来就排除最近 7 轮，召回质量不受影响）
# 注意：调大后，刚说的 1~2 轮内容不会立刻进长期记忆——
# 但它们在短期上下文里还在，所以对话表现不受影响；问"你还记得…"时会自动提前落库。
extract_every: 1

# 每轮抽取的**策略**。
#
#   split = **拆两个提示词各调一次**（默认）：
#           TEMPLATE_FACTS 抽 facts+relations，TEMPLATE_META 抽 summary/emotion/preferences。
#   union = 同提示词跑 `extract_passes` 次、按字段取并集（旧行为，留着做 A/B）。
#
# ⚠ 为什么默认换成 split：三次独立复现的受控对比（n=120 原始 / n=96 过闸门）
#
#       方法            主体        值        字段     原始编造   过闸门后每条挡
#       split          120/120   120/120   106/120     10        0.18
#       union          113/120   116/120   101/120      0        0.15
#       拆×并(4次)      120/120   120/120    93/120     16         —
#
#   **决定性的是「值」（丢宾语）：split 比 union 多 8 个样本**（95/96 vs 87/96），
#   而"丢宾语"是抽取器最主要的毛病。split 还更快（1.00s vs 1.17s）。
#   split 的原始编造确实更多（10 vs 0），但**过闸门后只差 0.03**——
#   脏的那部分被 _grounded/_absolute_ok/_subject_ok 挡住了。
#   union 只在"总条目量"上略多（2.07 vs 1.99 条/轮）。
#
# ⚠ 代价：split 的**容错差**（每个半场只有一次调用）→ 靠 `_complete_json(retries=1)` 补。
# ⚠ 损失：split **没有 `agreement` 信号**了（每字段只有一份样本）。
extract_strategy: split

# 每轮抽取**跑几次**（跑多次取并集）——**只对 extract_strategy: union 生效**。
#
# 为什么是 2：抽取器剩下的毛病**主要是抖动**——同一句「林小雨对花生过敏」，
#   有时抽出「花生」、有时只留「过敏」。抖动改不了模型，但程序侧能兜：
#   两次里只要有一次抽对就救回来。
#   实测（tests/analysis/extract_union_probe.py，每句 6 次）：
#     「每次都对」的条目：单次 8/12 → **并集 11/12**
#     编造条数：          单次 0    → 并集 **0**（并集没引入脏东西）
#
# 代价：抽取耗时翻倍（2B 上 2.3s → 4.6s）。
#   但抽取发生在**回复之后**，用户无感；而漏抽的记忆是**永久**丢的。
#   算力紧张、或想做对照实验时设 1 退回单次。
# 也可用环境变量临时覆盖：COMPANION_EXTRACT_PASSES=1
extract_passes: 2
