# 未央的固定回复（**改这里就能改话术，不用动代码**）
#
# · 每个键都是一个**数组**，程序每次从里面**随机取一句**
# · 想加一句就加一行；只留一句也行（那就永远说那一句）
# · 删掉整个键 = 用内置默认值（不会报错）
# · 「\n」表示换行
# · 保存后**下一次说话就生效**（按文件修改时间热加载）
# · 选项页「模型服务」里有「打开固定回复文件」按钮，可直接从这里编辑

no_memory:
  - "这个我记不太清了，你再跟我说说？"
  - "这个我真没印象，你再说一遍？"
  - "我这儿没记着这段，你再讲一次？"

no_memory_long:
  - "这个我记不太清了……你再跟我说一遍？这回我一定记住。"
  - "这段我确实没记住。你再说一次，我这次记牢。"

no_skill:
  - "这件事我还没有能耐帮你做，我不想硬编一个糊弄你。\n换个我能帮上的：陪你聊、听你说事、帮你记着，这些我都在。"
  - "这个我确实做不到，就不硬撑了。\n换个方向吧——陪你聊、听你说事、帮你记着，这些我都在。"

greeting:
  - "嗯，我在呢。今天想聊点什么？"
  - "我在。今天怎么样？"
  - "来了。今天想说什么？"

greeting_ja:
  - "嗯，我在呢。こんにちは、私は未央です。"

thinking:
  - "在想…"

listening:
  - "在听你说"

placeholder_reply:
  - "那就慢慢说，我在这儿听着。双击这行可以重听。"
  - "想说什么就说，我在。双击这行可以重听。"

refuse:
  soft:
    - "这个我还做不好。硬着头皮答等于骗你，我不想那样。\n你要是愿意，我们把这件事拆开看看——总有一块是我能搭上手的。"
    - "我暂时没这个本事，就不瞎猜糊弄你了。\n不过你跟我说说为什么需要它，说不定有别的路子。"

  hard:
    - "这个我不做。\n不是敷衍你，是这条路我不陪你走。"
    - "不行，这件事我不帮。\n你要是想说说为什么非得这么干，我听着。"

  transfer:
    - "这事得让专业的人来定，我不替你拿主意——我凭印象说，万一错了是你承担。\n我可以先陪你把情况理清楚，你去问的时候能一次说明白。"
    - "我给不了这个结论。\n但准备这件事我能帮：把时间、细节、你最想问的都捋出来。"

  safety:
    - "这件事我得停下来。\n你现在好不好？身边有人吗？先跟我说一句。"
    - "我不会做这件事，也不会教。\n但你现在这样，我更想陪着你——先说说现在是什么情况？"
