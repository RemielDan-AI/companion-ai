# 说话风格：语气、长度、正式度、幽默感、禁用词、常用词
# 阶段 4 风格引擎读取；人设身份仍在 persona.yaml，这里只管"怎么说话"

tone: 温柔体贴

# 各档位的回复长度上限（后处理会按这个裁）
length_limit:
  l0: 60
  l1: 140
  l2: 400
  l3: 800

# 两段式补充：主回复发出去之后，再自己「补一句」（连发几条，用户侧看不出是两段）
#
# ⚠ 2026-10-20 实测基线（v1.5，6 题 × 2 次，走 say()）：
#   采用率 **33%**，短档 16 字 vs 长档 36 字 → **差 20 字**
#   → 这就是「同一个问题时短时长」的来源：约三分之一的轮次会说第二句。
#
# 三步把关（缺一不可）：
#   ① 逐句二元组 ≥ echo_th → 判重复，丢掉
#      （⚠ 整段比会被长补充稀释，实测漏放过一小句原样复述）
#   ② strip_claims 剪掉编造的旧事指涉（"你上次也…"）；剪光就丢
#   ③ 监督官判「值不值得接」——**专门抓二元组抓不到的那两类**：
#      换了说法的复读、以及废话/答非所问
#      （实测：4B 判"字面重复"准确率 86%，**不如阈值**；
#        但判"这段有没有意义"阈值做不到，所以这一步不能省）
#
# ⚠ **这一步"拿不准就丢"**，和记忆那边正好相反：
#     记忆：误杀 = 丢记忆，比漏拦更糟 → 宁可放过
#     补充：丢错 = 退化成短回复，**安全**；放过 = 废话上线，丢人 → 宁可丢掉
supplement:
  enabled: false          # 默认关；想试就改 true
  prob: 0.5               # 触发概率（只在 enabled 时才掷）
  echo_th: 0.3            # 逐句二元组阈值，≥ 判重复
  judge: true             # 是否请监督官判（false = 只用程序 + 剪句）
  judge_url: ""           # 空 = 用 8084
  max_chars: 60           # 补充本身的上限，超了就不接（防它写小作文）

# 第三道门：**语义接地判定**（4B 监督官）——补程序查不到的那类编造
#
# 程序侧已经能挡两类：
#   · strip_claims        「你上次也…」这类**编前情**
#   · unsupported_numbers 带数字的**编属性**（「你还没满 18 周岁」）
#
# 但「你已经结婚了吧」「你养的那只狗叫什么」这类**没数字、也没过去指涉**的编造，
# 程序只能对上字符串，抓不到。实测在**专门挑程序抓不到的 12 例**上：
#
#     程序侧      抓到 0/6
#     4B 监督官    准确 92%　**精确 100%**　召回 83%（TP5 FP0 TN6 FN1）
#
# ⚠ **精确率 100% 比召回更要紧**：误判会多跑一次重生成（慢、还可能把话改差）。
#   所以判完只做一件事——**重生成一次**；再判不过就照发，**绝不剪句**
#   （剪句会把正常话剪成「这个我记不太清了」，之前踩过）。
#
# ⚠ **只在有证据时才判**（记忆块或工具结果非空）：没有任何证据时，
#   什么回复都超出，判了只会满屏重试。
groundedness:
  enabled: false          # 默认关；这要常驻一个 4B（约 2.6 GB 内存 + 0.5s/轮）
  url: ""                 # 空 = 用 8084
  max_evidence_chars: 400 # 证据太长不判（省时间；也避免判官被淹没）
  retry: true             # 判超了要不要重生成一次

formality: 低        # 说话随意，不端架子、不用敬语
humor: 少量          # 看场合，不硬抖机灵
emoji: 不用

# 禁用词（客服腔与模板腔）：命中就替换或删除
banned_phrases:
  "您好": ""
  "亲，": ""
  "请问您": "你"
  "有什么可以帮您": "怎么了"
  "很高兴为您服务": ""
  "很高兴为您解答": ""
  "希望这些信息对您有帮助": ""
  "希望对你有所帮助": ""
  "综上所述": "所以说"
  "首先，": ""
  "其次，": "然后"
  "最后，": "还有"
  "总之": "反正"
  "感谢您的耐心": ""

# 模型偶尔蹦英文词（实测 just/maybe/probably 等），这里直接换回中文
english_fixes:
  just: "就"
  maybe: "可能"
  probably: "大概"
  usually: "平时"
  actually: "其实"
  really: "真的"
  yeah: "嗯"
  alone: "一个人"
  company: "公司"
  stay: "待着"
  here: "这儿"
  anyway: "反正"

# 画像里的常用词（阶段 5 会根据价值观库自动生长）
common_words: ["嗯", "其实", "要不"]
