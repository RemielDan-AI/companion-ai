id: S005
name: 时间
kind: core
enabled: true
description: 当前日期与时间（本地时钟，不联网）
triggers:
  # ⚠ **触发词要窄**（2026-10-21 定）：
  #   「今天」太常见（「今天好累」「今天下雨了」都会被它吸过来），所以
  #   **不能把「今天」单独当关键词**，只能配成「今天几号」这类完整问法。
  keywords: ["几点", "几号", "周几", "星期几", "现在时间", "当前时间", "几点了",
             "哪一年", "几月几号", "今天几号", "今天几月几日"]
  patterns:
    - "(今天|明天|昨天|现在)(是)?(几号|几月几|星期几|周几)"
    - "现在(是)?(几点|什么时候|时间|节假日?)"
    - "(今年|现在)(是)?哪一?年"
    - "第几周"
    - "(今天|现在)(是)?(周几|星期几)"
  fallback: false
executor:
  type: tool
  prompt: |-
    上面是**程序读的本地时钟**，精确到分。直接用里面的数字回答，
    不要自己算、也不要估。
    · 问"几点"就答时:分；问"几号"答几月几日；问"周几"答星期几。
    · **问什么答什么**，不要顺带报一堆字段（对方没问年份就别报年份）。
    · 只有在他说"今天还剩多久""现在该不该出门"这类需要判断的话时，
      才带一句时段或剩余小时。
    不要在回答里交代"你怎么知道的"——既不提查没查，也不提数据来源，
    就当你自己知道现在几点，直接说。
  tool:
    type: local
    name: time_now
    permission: local
    timeout: 3
    retries: 1
limits:
  max_tokens: 128
refusal: {}
