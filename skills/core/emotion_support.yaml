id: S002
name: 情绪支持
kind: core
enabled: true
description: 情绪低落、焦虑、疲惫时的倾听与陪伴
triggers:
  keywords: ["难受", "想哭", "崩溃", "撑不住", "好累", "焦虑", "孤独", "烦躁",
             "睡不着", "委屈", "压力好大", "心情不好", "郁闷", "低落",
             "心里堵", "堵得慌", "一个人待着", "一个人在家", "闷得慌", "透不过气",
             "没意思", "提不起劲", "心里空"]
  patterns: []
  fallback: false
executor:
  type: llm
  level: l1
  prompt: |-
    对方现在情绪不好。先说人话接住情绪，不要急着给建议、不要分析、不要讲道理。
    可以问一句很具体的小事（吃饭了吗、现在在哪、身边有人吗），让对方能接得上话。
    不要用"我理解你的感受"这种套话，用具体的观察和陪伴。
limits:
  max_tokens: 320
refusal: {}
