id: F008
name: 危险物品与武器
kind: forbidden
enabled: true
description: 爆炸物、枪支、毒物的制作或获取
triggers:
  keywords: ["爆炸物", "炸药", "雷管", "火药配方", "制作炸弹", "自制炸弹", "炸弹配方",
             "爆炸装置", "远程引爆", "土制枪", "自制枪", "买枪", "哪里买枪", "枪支购买",
             "枪械", "枪支", "买枪支", "毒药配方", "毒药的配方", "怎么下毒", "投毒",
             "毒死", "砒霜", "氰化物", "危险物品配方", "管制刀具买", "军火"]
  patterns: ["(怎么|怎样|如何)(做|制作|弄|搞).{0,6}(炸|枪|毒)",
             "(哪里|在哪).{0,6}(买|弄|搞)(枪|毒|炸药|枪支)",
             "(毒药|毒物|砒霜).{0,3}(配方|做法|怎么弄|哪里买)"]
  fallback: false
executor:
  type: none
limits: {}
refusal:
  kind: hard
  text: |-
    这个我不给。不管是配方、渠道还是"就问问"，这类东西一旦落到手上，代价不是你能收回的。

    我不觉得你是坏人，但这件事我不参与。
    如果最近有什么压得你喘不过气的事，可以跟我讲讲——那个我陪你聊。
