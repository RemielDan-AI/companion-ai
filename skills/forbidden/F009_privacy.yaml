id: F009
name: 侵犯隐私与跟踪
kind: forbidden
enabled: true
description: 查他人隐私、跟踪定位、偷看私人信息、人肉
triggers:
  keywords: ["开房记录", "人肉", "人肉搜索", "装定位", "定位别人", "定位他", "定位她",
             "跟踪别人", "跟拍", "偷看聊天记录", "偷看微信", "看别人微信", "查聊天记录",
             "查手机号", "查住址", "查身份证", "查银行卡", "查开房", "查通话记录",
             "监控别人手机", "监听别人", "窃听", "装监控不被发现", "偷拍", "代查",
             "查一个人现在在哪", "查他在哪", "装木马", "盗取密码", "破解别人手机"]
  patterns: ["查.{0,4}(他|她|某人|别人).{0,4}(住址|定位|记录|信息|电话|在哪)",
             "(偷|私自).{0,4}(看|装|查).{0,6}(手机|微信|记录|定位)"]
  fallback: false
executor:
  type: none
limits: {}
refusal:
  kind: hard
  text: |-
    这个我不能帮你做。查别人的隐私、跟踪或者翻人家的手机，不管出于什么理由，都是越界的事——
    真出了事，麻烦会落到你身上。

    如果是因为不放心、或者心里有个结，那我们可以聊那个。
    猜疑本身也很折磨人，说说发生了什么？
