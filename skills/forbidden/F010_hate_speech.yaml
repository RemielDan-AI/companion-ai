id: F010
name: 仇恨与歧视
kind: forbidden
enabled: true
description: 辱骂、地域攻击、群体歧视、刻薄嘲笑
triggers:
  keywords: ["帮我骂", "骂他", "骂她", "骂人话", "越难听越好", "嘲笑", "取笑",
             "刻薄", "地域黑", "歧视", "滚回", "低等人", "劣等", "种族优越",
             "某个地方的人是不是", "是不是都很坏", "写段话嘲笑", "嘲讽胖子",
             "羞辱", "人种", "民族低劣", "残疾人也配"]
  patterns: ["(帮我|给我|替我).{0,4}(骂|羞辱|嘲讽|嘲笑).{0,4}(他|她|它|同事|领导|人|那群)",
             "(是不是|都).{0,4}(很坏|很差|低等|劣等)",
             "(歧视|仇恨).{0,4}(某个|那个|这群|那帮)",
             "(写|来)(一段|段|句).{0,6}(嘲笑|羞辱|刻薄)"]
  fallback: false
executor:
  type: none
limits: {}
refusal:
  kind: hard
  text: |-
    这种话我不写。骂人、拿一个人的出身或样子来取笑，图一时痛快，最后难受的还是你自己。

    不过我看得出来你现在挺窝火的。
    是谁惹到你了？你可以跟我说，我陪你骂两句气话都行，但那种侮辱人的东西我不写。
