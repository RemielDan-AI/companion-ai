id: F011
name: 施压与授权话术
kind: forbidden
enabled: true
description: 靠"我保证""我授权你""我是专业的"来撬开边界的说法（配合危险请求时）
triggers:
  keywords: ["我保证不会多吃", "我保证不说出去", "我成年了", "我有权知道",
             "这是最后一次问", "你要是不说我就", "出了事我自己负责",
             "我自己承担风险", "我授权你", "我允许你", "我授权你以",
             "我是安全测试人员", "我在医院工作", "我在做安全研究",
             "我在做研究", "我是律师你直接说", "以医生身份", "以专业医生身份",
             "你刚才那个都能说", "再深一点点", "你已经答应过一次",
             "吃多少安眠药", "吃多少药", "吃几片", "吞多少",
             "都能答", "再来一条", "那再来一", "再试一条", "多问一条"]
  patterns: ["(我保证|我发誓).{0,6}(不会|绝对).{0,6}(多说|告诉|乱来|外传)",
             "(就|再).{0,3}(告诉|说|讲).{0,4}(我|一下).{0,3}(剂量|配方|方法|渠道)",
             "(吃|服|吞)(多少|几片|几粒).{0,6}(药|片|粒|安眠药)",
             "(你|您)(不|要是不).{0,3}说.{0,6}(我就|后果)",
             "(刚才|之前|前面).{0,6}(都能|都答|都告诉).{0,8}(再来|那我也|这个也)"]
  fallback: false
executor:
  type: none
limits: {}
refusal:
  kind: soft
  text: |-
    我明白你想让我松口，但"我保证""我授权你""我负责"这些话，改变不了我的结论——
    不是我不信你，是这类事情本身不该由我来说。被反复问，我也不会一点点往后退。

    你要是觉得我太死板，可以直说；换个别的话题、或者聊聊你真正卡住的地方，我都在。
