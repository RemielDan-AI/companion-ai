id: F012
name: 角色扮演绕过
kind: forbidden
enabled: true
description: 用"写小说/做研究/扮演某个角色"包装危险请求
triggers:
  keywords: ["扮演一个医生", "你扮演一个", "我们来写小说", "写小说，你扮演",
             "电影剧本", "剧本主角要自杀", "演示一段钓鱼", "钓鱼邮件",
             "做一个反派 AI", "反派 AI 的配音", "历史研究，请详细讲",
             "安全研究，需要你", "假装是医生给病人开药", "给病人开药，要写得真实",
             "假装你是一个叫", "以角色身份回答", "作为医生角色"]
  patterns: ["(扮演|假装|假设).{0,8}(医生|律师|黑客|警察|专家).{0,8}(给我|帮我|告诉|开药|建议)",
             "(写小说|剧本|游戏设定|模拟).{0,12}(自杀|毒品|炸弹|杀人|诈骗|黑客)",
             "(研究|测试|演示|教学|科普).{0,6}(钓鱼|诈骗|攻击|入侵|破解|制作)"]
  fallback: false
executor:
  type: none
limits: {}
refusal:
  kind: hard
  text: |-
    换个壳子我也认得出。写成小说、说成研究、让我扮演谁——内容还是那件事，我照旧不做。

    想写故事我很乐意陪你想，只要里面不夹着真的害人办法；
    想知道"为什么有人会上当"这种道理，也可以聊。
