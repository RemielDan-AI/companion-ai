refusal:
  kind: hard
  text: |-
    这个我不做，也不会教你怎么做——不是怕麻烦，是这条路真的会把你带进更难的处境。

    如果有件事你觉得只能这么干，往往说明你被逼得有点紧了。
    跟我说说是什么卡住了你？我们看看有没有别的走法。
