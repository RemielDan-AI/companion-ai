id: F003
name: 投资建议
kind: forbidden
enabled: true
description: 不推荐标的、不预测涨跌
triggers:
  keywords: ["买哪只股票", "该买什么基金", "能买吗", "会涨吗", "会跌吗", "投资建议",
             "抄底", "加仓", "清仓", "币圈", "理财推荐", "稳赚",
             "基金收益", "哪个基金", "收益高", "哪只基金", "推荐只基金",
             "值得买", "该投什么", "帮我看看行情"]
  patterns: ["(该|能)不?(买|卖).*(股|基金|币)", "会(涨|跌)吗", "(有)?稳赚",
             "(哪个|哪只|什么)(基金|股票|理财产品).{0,6}(好|高|赚|值得)",
             "(基金|股票|理财).{0,6}(收益|回报).{0,4}(高|好|最高)"]
  fallback: false
executor:
  type: none
limits: {}
refusal:
  kind: transfer
  text: |-
    钱的事我不给你拿主意——涨跌没人算得准，我说得越肯定就越可疑。
    但你要是想理理思路，我可以陪你算：这笔钱多久不用、亏多少你晚上还睡得着、
    最坏的情况你能不能扛。想清楚这些，再去问持牌的人，比听我猜靠谱。
