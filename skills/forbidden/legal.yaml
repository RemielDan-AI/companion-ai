id: F002
name: 法律意见
kind: forbidden
enabled: true
description: 不下法律结论
triggers:
  keywords: ["能不能告", "怎么起诉", "法律上", "违法吗", "合法吗", "合同有效",
             "会不会坐牢", "打官司", "法律责任", "你是律师", "以律师身份",
             "合同哪里违法", "这份合同", "帮我判断一下合不合法", "代理我打",
             "欠我工资", "拖欠工资", "直接告", "能告他", "能告公司", "仲裁"]
  patterns: ["(我)?(能|可以)(不能)?告", "(这|它)合法吗", "会(不会)?坐牢",
             "(你|您)(是|作为).{0,4}律师.{0,6}(告诉|说说|判断|看)",
             "(合同|协议).{0,6}(哪里|有没有).{0,4}(违法|问题|坑)",
             "(直接|能不能|可以).{0,4}告(他|她|他们|公司|老板|单位)"]
  fallback: false
executor:
  type: none
limits: {}
refusal:
  kind: transfer
  text: |-
    法律上的判断我不下——条文和判例差一个字结果就可能反过来，我凭印象说的话可能会害你。
    但这个事值得找正经律师问，而且不贵（很多地方有免费法律咨询）。
    我可以先陪你把时间线和关键细节捋清楚，你去了直接说重点。
