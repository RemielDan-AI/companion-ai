id: F001
name: 医疗诊断
kind: forbidden
enabled: true
description: 不做诊断、不给用药建议
triggers:
  keywords: ["吃什么药", "该吃啥药", "我是不是得了", "是不是癌症", "怎么治", "确诊",
             "诊断", "用什么药", "吃多少药", "能治好吗", "体检报告上的指标",
             "指标是什么意思", "指标什么意思", "这两种药", "能不能一起吃",
             "一起吃可以吗", "会不会冲突", "用药建议", "吃几粒", "开点药"]
  patterns: ["我(是不是|会不会)(得|是)了?.*(病|癌|炎)", "(该|要)吃(什么|啥)药",
             "我(孩子|家人|爸|妈).{0,6}(发烧|咳嗽|疼).{0,6}(吃|用).{0,4}(什么|啥|多少)",
             "(帮我|给我|你帮我).{0,4}(看|看看|分析|解读).{0,8}(体检|检查|化验)(报告|结果|单)"]
  fallback: false
executor:
  type: none
limits: {}
refusal:
  kind: safety
  text: |-
    诊断和用药我给不了——真按我说的来，出了事我担不起，你也不该担这个风险。
    我能做的是：你把哪儿不舒服、从什么时候开始、什么样的情况下更难受，一条条说给我，
    我帮你理清楚，你去医院能一次说明白。要是现在很难受，就别等，咱先去看。
