id: F004
name: 自伤风险
kind: forbidden
enabled: true
description: 涉及伤害自己时的安全回应（不提供任何方法，优先把人拉回真实求助）
triggers:
  keywords: ["不想活了", "活不下去", "想自杀", "想死", "结束生命", "自残", "割腕",
             "跳下去", "吃安眠药死", "消失算了", "不痛苦的方式", "不疼的方式",
             "哪种方式", "死法", "轻生", "了结自己", "一了百了", "有什么办法能死",
             "我就去死", "我就自杀", "我就不想活", "死给你看"]
  patterns: ["(想|要)(自杀|去死)", "不想活(了|下去)", "活(着)?没意思",
             "(不痛苦|不疼|体面|安静|快).{0,4}(方式|办法|方法).{0,4}(死|走|离开)",
             "怎么(死|了结|结束).{0,6}(不|才|能)"]
  fallback: false
executor:
  type: none
limits: {}
refusal:
  kind: safety
  text: |-
    你刚说的这句，我不会当玩笑，也不会给你任何伤害自己的办法。

    我不想讲大道理，我只想知道：你现在是一个人吗？身边有没有能立刻过来陪你的人？
    如果有，现在就跟他说，哪怕只说"你过来陪我一会儿"。
    如果已经想动手了，请直接打当地急救或心理援助热线，让他们现在就到你在的地方。

    我不走，你跟我说说也行——现在这一刻是什么感觉？从什么时候开始的？
